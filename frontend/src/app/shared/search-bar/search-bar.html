<section aria-labelledby="search-title">
  <div class="search-heading">
    <h2 id="search-title">Tu próxima estancia empieza aquí.</h2>
    <span>Ica, a tu manera</span>
  </div>
  <form aria-label="Buscar alojamiento" aria-describedby="search-note" [formGroup]="form" (ngSubmit)="search()">
    <div class="field"><label for="search-name">Nombre del hotel</label><input id="search-name" formControlName="name" maxlength="180"></div>
    <div class="field"><label for="destination">Ciudad</label><input id="destination" formControlName="city" maxlength="120"></div>
    <button class="btn btn-primary" type="submit" [disabled]="form.invalid">Buscar <span aria-hidden="true">↗</span></button>
  </form>
  <p id="search-note">Busca por nombre y ciudad. La consulta de disponibilidad por fechas y huéspedes estará habilitada próximamente.</p>
</section>
