<a class="skip-link" href="#contenido">Saltar al contenido</a>
<header class="container header">
  <a class="wordmark" routerLink="/" aria-label="Ica Stay, inicio">ICA STAY<span>ALOJARSE. EXPLORAR. VOLVER.</span></a>
  <nav aria-label="Navegación principal">
    <a routerLink="/" fragment="alojamientos">Alojamientos</a>
    <a routerLink="/" fragment="explorar">Explorar Ica</a>
    <button type="button" disabled>Mis reservas <small>Próximamente</small></button>
  </nav>
  <div class="session">
    @if (auth.session(); as session) {
      <span class="session-email">{{ session.email }}</span>
      <button type="button" (click)="auth.logout()">Cerrar sesión</button>
    } @else {
      <a routerLink="/login">Iniciar sesión</a>
    }
  </div>
</header>
